<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus Study A5 · Top-Down + QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  --felt:#2f5d50; --felt-d:#234a3f; --kraft:#c9a37a; --cream:#f4ebdd; --walnut:#5a3a22; --walnut-d:#3b2414;
  --brass:#b8893b; --brass-l:#e0b865; --ink:#2b2118; --red:#9e3b2e; --green:#5fae6a; --amber:#e6a93a;
  --slab:"Alfa Slab One",Georgia,serif; --serif:"Libre Baskerville",Georgia,serif; --hand:"Caveat","Segoe Print",cursive;
  --rim:clamp(10px,2vw,22px);
}
*{box-sizing:border-box}
html{background:#24150b}
body{margin:0;min-height:100vh;color:var(--cream);font:400 16px/1.5 var(--serif)}
button,a{font:inherit}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid #ffe08a;outline-offset:3px}

/* ---------- table rim (walnut) and felt surface ---------- */
.table{position:relative;min-height:100vh;padding:var(--rim);overflow-x:clip;
  background:
    repeating-linear-gradient(92deg,#0000 0 9px,#2a180b1f 9px 10px,#0000 10px 23px,#ffffff06 23px 24px,#0000 24px 41px),
    linear-gradient(180deg,#7b5432,#5a3a22 50%,#46291a);
}
.felt{position:relative;min-height:calc(100vh - 2 * var(--rim));border-radius:16px;overflow-x:clip;
  padding:4.6rem clamp(1rem,3vw,2.4rem) 5.5rem;
  background:
    radial-gradient(ellipse 70% 55% at 42% 38%,#ffffff12,#0000 70%),
    radial-gradient(ellipse at 50% 50%,#0000 58%,#00000040 100%),
    repeating-linear-gradient(0deg,#ffffff06 0 1px,#0000 1px 3px),
    repeating-linear-gradient(90deg,#00000014 0 1px,#0000 1px 3px),
    var(--felt);
  box-shadow:inset 0 0 0 2px #1e1209,inset 0 0 0 5px #6b4527,inset 0 0 28px 8px #0008;
}

/* ---------- brass nameplate stuck on the rim ---------- */
.plate{position:absolute;z-index:4;top:calc(var(--rim) * .35);left:clamp(18px,3.4vw,44px);
  padding:.5rem 1.2rem .55rem 2.2rem;border-radius:4px;transform:rotate(-1.8deg);
  background:linear-gradient(160deg,#f2d79a,#b8893b 55%,#8e6b2c);color:#2b1c08;
  box-shadow:0 3px 0 #2b1a0e,0 8px 14px #0008,inset 0 1px 0 #fff6}
.plate::before,.plate::after{content:"";position:absolute;top:50%;left:.8rem;width:8px;height:8px;margin-top:-4px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8,#5b4119 70%)}
.plate::after{left:auto;right:.8rem}
.plate h1{font:400 1.2rem/1 var(--slab);letter-spacing:.02em;text-shadow:0 1px 0 #fff4}
.plate small{display:block;margin-top:.2rem;font:italic 400 .7rem/1.2 var(--serif);letter-spacing:.04em;opacity:.8}

/* ---------- banners and feedback (cardstock notes) ---------- */
.notes{display:grid;gap:.6rem;max-width:76rem;margin:0 auto}
.banner{margin:0;padding:.6rem .9rem;border-radius:3px;background:#f8e4a8;color:var(--ink);
  font:700 1.15rem/1.3 var(--hand);box-shadow:0 3px 0 #0003;transform:rotate(-.3deg);
  display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.banner.bad{background:#f3c2b8}
.feedback{width:fit-content;max-width:100%;margin:.8rem auto 0;padding:.35rem .9rem;border-radius:3px;background:var(--cream);color:var(--ink);
  font:700 1.2rem/1.2 var(--hand);box-shadow:0 2px 0 #0003}
.feedback:empty{padding:0;background:none;box-shadow:none}

/* ---------- on the table ---------- */
.stage{max-width:76rem;margin:1.2rem auto 0}
.play-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:1.6rem 2.2rem;padding-left:clamp(0px,4vw,3.5rem)}
.play{flex:0 1 40rem;min-width:0;max-width:100%}
.pad{flex:0 1 20rem;min-width:0;max-width:100%}

/* open box: container so every component scales with the box */
.opened{position:relative;container-type:inline-size;aspect-ratio:3/2;width:100%;--hue:200;--hue2:224}
.tray{position:absolute;left:4%;top:8%;width:57%;height:66%;border-radius:6px;transform:rotate(-1.5deg);transform-origin:50% 60%;
  transition:transform .7s cubic-bezier(.3,1.3,.5,1);
  background:linear-gradient(160deg,#8e6040,#5a3a22 62%,#43291a);
  box-shadow:inset 0 0 0 2px #2b1c10,inset 0 0 0 6px #6f4a2c,0 3px 0 #2b1c10,0 4px 0 #22150c,12px 16px 18px -4px #000c}
.tray::before{content:"";position:absolute;inset:7% 6% 6% 7%;border-radius:4px;
  background:
    linear-gradient(90deg,#0000 calc(62% - 1px),#5a3a2266 62%,#0000 calc(62% + 1px)),
    repeating-linear-gradient(120deg,#ffffff0c 0 5px,#0000 5px 11px),
    linear-gradient(170deg,#d4b28a,#b58b5f);
  box-shadow:inset 0 4px 10px #0007,inset 0 -2px 0 #ffffff22}

/* dice: pips are radial dots, sized in em so they scale with the die */
.die{position:absolute;font-size:12cqw;width:1em;aspect-ratio:1;border-radius:22%;
  background:
    radial-gradient(circle .085em at 28% 28%,#fbf3e4 96%,#0000 100%),
    radial-gradient(circle .085em at 50% 50%,#fbf3e4 96%,#0000 100%),
    radial-gradient(circle .085em at 72% 72%,#fbf3e4 96%,#0000 100%),
    linear-gradient(145deg,hsl(var(--hue) 62% 56%),hsl(var(--hue) 58% 36%));
  box-shadow:inset 0 -3px 0 #0005,inset 0 2px 0 #fff4,0 3px 0 #0005,0 6px 8px -2px #0007}
.die.d5{background:
    radial-gradient(circle .085em at 28% 28%,#fbf3e4 96%,#0000 100%),
    radial-gradient(circle .085em at 72% 28%,#fbf3e4 96%,#0000 100%),
    radial-gradient(circle .085em at 50% 50%,#fbf3e4 96%,#0000 100%),
    radial-gradient(circle .085em at 28% 72%,#fbf3e4 96%,#0000 100%),
    radial-gradient(circle .085em at 72% 72%,#fbf3e4 96%,#0000 100%),
    linear-gradient(145deg,hsl(var(--hue) 62% 56%),hsl(var(--hue) 58% 36%))}
.d3{left:9%;top:14%;transform:rotate(-10deg)}
.d5{left:30%;top:40%;transform:rotate(14deg)}

.cube{position:absolute;width:6cqw;aspect-ratio:1;border-radius:2px;
  background:linear-gradient(135deg,hsl(var(--hue) 66% 64%),hsl(var(--hue) 52% 40%));
  box-shadow:inset -3px -3px 0 #0003,inset 2px 2px 0 #fff5,0 2px 0 #0005,0 4px 6px -2px #0008}
.q1{left:60%;top:14%;transform:rotate(18deg)}
.q2{left:70%;top:34%;transform:rotate(-8deg)}

.meeple{position:absolute;width:6cqw;height:auto;aspect-ratio:3/4;fill:hsl(var(--hue) 58% 46%);
  filter:drop-shadow(0 2px 0 #0006) drop-shadow(0 4px 3px #0004);overflow:visible}
.m1{left:12%;top:66%}
.m2{left:42%;top:68%;transform:rotate(-10deg)}

/* lid leaning against the box, foreshortened so it reads as standing up */
.lid-leaning{position:absolute;right:4%;top:6%;width:34%;height:45%;border-radius:4px;
  transform:perspective(620px) rotateX(46deg) rotate(-7deg);transform-origin:50% 100%;transition:transform .7s ease;
  box-shadow:0 2px 0 #0004,6px 14px 16px -6px #000b}

/* fanned cards */
.fan{position:absolute;left:3%;bottom:3%;width:34%;height:46%}
.card{position:absolute;bottom:0;width:56%;aspect-ratio:5/7;border-radius:7px;box-shadow:0 3px 0 #0004,0 7px 10px -3px #0008}
.card.back{background:repeating-linear-gradient(45deg,hsl(var(--hue) 46% 38%) 0 5px,hsl(var(--hue) 50% 28%) 5px 10px);border:3px solid #f6eedb}
.card.face{display:grid;place-items:center;background:#fbf4e4;color:hsl(var(--hue) 56% 38%)}
.card.face svg{width:62%;height:auto;display:block}
.k1{left:0;transform:rotate(-9deg)}
.k2{left:22%;transform:rotate(2deg)}
.k3{left:44%;transform:rotate(12deg)}

/* rulebook booklet with handwritten description */
.booklet{position:absolute;right:5%;bottom:4%;width:40%;padding:4% 4.5% 4.5%;border-radius:2px;
  background:linear-gradient(#fdf7e8,#f1e4c8);color:var(--ink);transform:rotate(3deg);
  box-shadow:0 2px 0 #0003,4px 8px 12px -4px #0009}
.booklet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(#8a6a44 0 4px,#0000 4px 9px)}
.bk-title{margin:0 0 .15rem 6px;font:400 clamp(.85rem,2.6cqw,1.1rem)/1.1 var(--slab)}
.bk-text{margin:0 0 0 6px;font:600 clamp(.95rem,3.4cqw,1.35rem)/1.2 var(--hand);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

/* failed state: tipped box, red X token, torn note */
.play.failed .tray{transform:rotate(-19deg) translate(-3%,5%);filter:saturate(.8) brightness(.92)}
.torn-wrap{position:absolute;right:4%;bottom:4%;width:46%;display:none;transform:rotate(-4deg);filter:drop-shadow(0 3px 2px #0006)}
.torn{padding:6% 7% 9%;background:#f3c9bd;color:#4b1a12;
  clip-path:polygon(0 5%,5% 0,12% 4%,20% 0,31% 3%,40% 0,50% 4%,61% 0,70% 3%,80% 0,90% 4%,100% 1%,97% 25%,100% 50%,96% 74%,100% 99%,89% 96%,79% 100%,69% 95%,58% 100%,47% 96%,36% 100%,25% 95%,14% 100%,4% 96%,0 100%,3% 72%,0 48%,2% 24%)}
.torn-title{font:400 clamp(.95rem,4.4cqw,1.3rem)/1.1 var(--slab);margin-bottom:.2rem}
.torn-text{font:700 clamp(.9rem,4cqw,1.2rem)/1.2 var(--hand)}
.xtok{position:absolute;left:34%;top:40%;width:19%;aspect-ratio:1;border-radius:50%;display:none;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#ec8270,#9e3b2e 68%,#6e2519);
  box-shadow:inset 0 -4px 0 #0005,0 5px 0 #0006,0 9px 14px #0008}
.xtok::before,.xtok::after{content:"";position:absolute;left:50%;top:50%;width:64%;height:14%;border-radius:4px;background:#fbeee6;
  transform:translate(-50%,-50%) rotate(45deg)}
.xtok::after{transform:translate(-50%,-50%) rotate(-45deg)}
.play.failed .torn-wrap{display:block}
.play.failed .booklet{display:none}
.play.failed .xtok{display:block}

/* starting: tokens are set out on the box with a staggered keyframe */
@keyframes setout{
  from{opacity:0;translate:var(--fx,-46px) var(--fy,-34px);rotate:-38deg;scale:.4}
  to{opacity:1;translate:0 0;rotate:0deg;scale:1}
}
.play.starting .tok{animation:setout .6s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0) * 140ms)}
.play.starting .tok.card{--fx:-30px;--fy:-50px}
.play.starting .tok.meeple{--fx:-60px;--fy:10px}

/* empty centre: dashed drop zone with a hint */
.drop{position:relative;width:100%;aspect-ratio:3/2;display:grid;place-items:center;align-content:center;gap:.4rem;
  padding:1.4rem;border:3px dashed #ffffff4d;border-radius:22px;text-align:center;background:#0000001c}
.drop b{font:400 clamp(1.6rem,4vw,2.2rem)/1.05 var(--slab);text-shadow:0 2px 0 #0007}
.drop p{font:700 1.35rem/1.25 var(--hand);color:#d7e7dd;max-width:20em}
.arrow{width:7.5rem;height:auto;color:#ffffffb0;margin-top:.4rem;transform:rotate(-8deg)}
.arrow path{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

/* score pad: cardstock note beside the open box */
.pad{position:relative;margin-top:.6rem;padding:1.5rem 1.3rem 1.3rem;border-radius:3px;color:var(--ink);transform:rotate(1.1deg);
  background:
    repeating-linear-gradient(#0000 0 1.7rem,#8fa7a044 1.7rem calc(1.7rem + 1px)),
    linear-gradient(#fbf5e8,#efe3cc);
  box-shadow:0 2px 0 #0003,6px 10px 18px -6px #000b}
.pad::before{content:"";position:absolute;top:-.8rem;left:50%;width:6.5rem;height:1.7rem;transform:translateX(-50%) rotate(-2deg);
  background:#e5d3a6b3;box-shadow:0 1px 0 #0002}
.pad-kicker{font:700 1.15rem/1 var(--hand);color:#7a4b2a}
.pad-title{margin:.1rem 0 .35rem;font:400 clamp(1.5rem,3vw,1.9rem)/1.05 var(--slab)}
.meta{margin:.25rem 0;font:700 1.15rem/1.2 var(--hand);color:#4b3520}
.up{margin:.1rem 0 .6rem;font:700 1.25rem/1.2 var(--hand)}
/* join ticket: a themed QR code printed on cardstock; the whole ticket is one big copy button */
.qr-ticket{all:unset;box-sizing:border-box;display:block;position:relative;width:100%;margin:.8rem 0 1rem;padding:.85rem .85rem .75rem;cursor:pointer;
  text-align:center;border-radius:6px;color:var(--ink);
  background:linear-gradient(#fffaf0,#f1e3c8);border:2px solid #4a3420;
  box-shadow:0 3px 0 #4a3420,0 9px 14px -4px #0009,inset 0 0 0 4px #f7edd8,inset 0 0 0 5px #b8893b99;
  transform:rotate(-1.4deg);transition:transform .15s,box-shadow .15s}
.qr-ticket:hover{transform:rotate(0deg) translateY(-3px);box-shadow:0 5px 0 #4a3420,0 14px 18px -4px #000a,inset 0 0 0 4px #f7edd8,inset 0 0 0 5px #b8893b99}
.qr-ticket:active{transform:translateY(2px)}
.qr-ticket:focus-visible{outline:3px solid #ffe08a;outline-offset:4px}
.qr-k{display:block;font:700 1.6rem/1 var(--hand);color:var(--red)}
.qr-box{display:block;margin:.45rem auto .35rem;width:min(100%,15rem);aspect-ratio:1;border-radius:4px;background:#fbf5e8;box-shadow:inset 0 0 0 2px #2b1a0e1f}
.qr-box svg{display:block;width:100%;height:100%}
.qr-hint{display:block;font:700 1.1rem/1.1 var(--hand);color:#6b4a2a}
.qr-stamp{position:absolute;right:-.5rem;top:.2rem;padding:.25rem .65rem;border:3px double var(--red);border-radius:6px;background:#fbf5e8f2;color:var(--red);
  font:400 1.05rem/1 var(--slab);text-transform:uppercase;white-space:nowrap;transform:rotate(12deg) scale(1.5);opacity:0;pointer-events:none;transition:opacity .15s,transform .18s}
.qr-ticket.copied .qr-stamp{opacity:1;transform:rotate(12deg) scale(1)}
.pad-acts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.4rem}

.lamp{display:inline-flex;align-items:center;gap:.5rem;margin:.1rem 0 .3rem;font:700 .8rem/1 var(--serif);letter-spacing:.12em;text-transform:uppercase;color:#4b3520}
.lamp i{width:16px;height:16px;border-radius:50%;background:#8b8b82;border:2px solid #0005;box-shadow:inset 0 2px 2px #fff6,0 2px 0 #0005}
.lamp.running i{background:var(--green);box-shadow:inset 0 2px 2px #fff6,0 0 12px 3px #5fae6a99}
.lamp.starting i,.lamp.stopping i{background:var(--amber);animation:pulse 1s ease-in-out infinite}
.lamp.failed i{background:#d1503e;box-shadow:inset 0 2px 2px #fff4,0 0 12px 2px #d1503e88}
@keyframes pulse{50%{opacity:.35}}

/* ---------- chunky wooden / brass tokens (buttons) ---------- */
.token{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;min-width:44px;padding:.55rem 1.05rem;
  border-radius:10px;border:2px solid #2b1c08;border-bottom-width:5px;cursor:pointer;text-decoration:none;white-space:nowrap;
  font:700 .95rem/1 var(--serif);box-shadow:inset 0 2px 0 #fff5;transition:transform .08s,filter .15s}
.token:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.token:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.token.brass{background:linear-gradient(#f0cf7a,#c8973f 55%,#a57628);color:#2b1c08}
.token.wood{background:linear-gradient(#8a5d38,#5a3a22);color:#f7eddc;border-color:#21140a}
.token.paper{background:linear-gradient(#fcf6ea,#e7d8bd);color:var(--ink);border-color:#4a3420}
.token.red{background:linear-gradient(#d86f5c,#9e3b2e);color:#fff8f0;border-color:#4a1a12}

/* ---------- library: boxes lying flat in a loose scatter ---------- */
.library{max-width:76rem;margin:2.4rem auto 0}
.lib-head{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-bottom:1.2rem}
.lib-head h2{font:400 1.5rem/1 var(--slab);color:var(--cream);text-shadow:0 2px 0 #0006}
.count{margin-right:auto;font:italic 400 .95rem/1.2 var(--serif);color:#d4e4da}
.scatter{list-style:none;margin:0;padding:.4rem .4rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:2.2rem 1.6rem;align-items:start}
.slot{position:relative;min-width:0;--lift:0px;--sc:1}
.slot:nth-child(even){margin-top:1.2rem}
.slot:hover,.slot:focus-within,.slot:active{--lift:-7px;--sc:1.04}

.lid{position:relative;width:100%;aspect-ratio:4/5;border-radius:4px;
  transform:translate(var(--dx,0px),calc(var(--dy,0px) + var(--lift))) rotate(var(--r,0deg)) scale(var(--sc));
  transition:transform .22s ease,box-shadow .22s ease;
  box-shadow:2px 3px 0 #6e4a2a,4px 6px 0 #4f331d,8px 14px 16px -4px #000c}
.slot:hover .lid,.slot:focus-within .lid,.slot:active .lid{box-shadow:2px 3px 0 #6e4a2a,4px 6px 0 #4f331d,14px 26px 26px -6px #000d}

.cover{position:absolute;inset:0;border-radius:4px;overflow:hidden;color:#fff;
  background:
    radial-gradient(circle at 30% 18%,hsl(var(--hue) 85% 74% / .55),#0000 48%),
    repeating-linear-gradient(135deg,#ffffff12 0 6px,#0000 6px 12px),
    linear-gradient(165deg,hsl(var(--hue) 52% 46%),hsl(var(--hue2) 56% 24%))}
.cover::after{content:"";position:absolute;inset:6%;border:2px solid #fff4;border-radius:3px;pointer-events:none}
.cover .glyph{position:absolute;left:50%;top:44%;width:42%;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 0 #0005)}
.cover .glyph svg{display:block;width:100%;height:auto}
.cover .band{position:absolute;left:0;right:0;top:0;display:grid;gap:.1rem;padding:.55rem .6rem .6rem .8rem;background:linear-gradient(#000c 40%,#0000)}
.cover .band b{font:400 1.05rem/1.1 var(--slab);text-shadow:0 2px 0 #0007}
.cover .band small{font:700 .7rem/1.2 var(--serif);letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.chip{position:absolute;right:8%;bottom:1.7rem;padding:.2rem .5rem;border-radius:99px;background:var(--cream);color:var(--ink);
  font:700 .66rem/1 var(--serif);letter-spacing:.08em;text-transform:uppercase}

/* cardstock tag tucked under the box, carries the start button */
.tag{position:relative;display:grid;gap:.45rem;margin:-.9rem -.3rem 0;padding:1.05rem .6rem .6rem;border-radius:3px;
  background:var(--cream);color:var(--ink);box-shadow:0 2px 0 #0003,3px 6px 10px -4px #0008;
  transform:translateY(var(--lift)) rotate(calc(var(--r, 0deg) * -.5));transition:transform .22s ease}
.tag::before{content:"";position:absolute;left:50%;top:.35rem;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:#3b2414;box-shadow:inset 0 1px 1px #0008,0 1px 0 #fff5}
.tag .info{font:700 1rem/1.1 var(--hand);color:#5a3a22;text-align:center}
.tag .token{width:100%}

/* empty dashed outline where the active box normally sits */
.gap-box{width:100%;aspect-ratio:4/5;display:grid;place-items:center;padding:.5rem;text-align:center;
  border:3px dashed #ffffff47;border-radius:6px;background:#0002;font:700 1.25rem/1.1 var(--hand);color:#ffffffb3}

/* ---------- banners in the rim ---------- */
.dlg-acts{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}

/* ---------- dialog ---------- */
dialog{width:min(28rem,calc(100% - 2rem));border:0;border-radius:6px;padding:1.6rem 1.6rem 1.3rem;background:var(--cream);color:var(--ink);box-shadow:8px 14px 0 #0005}
dialog::backdrop{background:#1e1209cc}
dialog h2{margin:0 0 .4rem;font:400 1.5rem/1.1 var(--slab)}
dialog p{margin:0;font:400 1rem/1.5 var(--serif)}
dialog .seal{position:absolute;right:1.1rem;top:-16px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d1503e,#8a2a1f);box-shadow:0 3px 0 #0004;display:grid;place-items:center;color:#f7d3cb;font:400 1.4rem/1 var(--slab)}

/* ---------- responsive: phones (390px and up) ---------- */
@media (max-width:720px){
  .felt{padding:4.4rem .8rem 5.5rem}
  .play-row{padding-left:0;gap:1.2rem}
  .play,.pad{flex-basis:100%}
  .pad{max-width:none;margin-top:0}
  .opened{aspect-ratio:5/4}
  .lid-leaning{height:40%}
  .scatter{grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem .9rem;padding:0}
  .library{margin-top:1.8rem}
  .lib-head h2{font-size:1.3rem}
  .plate h1{font-size:1rem}
  .tag .token{font-size:.78rem;padding-inline:.35rem}
  .tag{margin:-.9rem -.3rem 0}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="table">
  <header class="plate">
    <h1>Tabletop Nexus</h1>
    <small>Game night, laid out</small>
  </header>

  <main class="felt">
    <div id="notes" class="notes"></div>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

    <section class="stage" aria-label="On the table">
      <div class="play-row">
        <div id="play" class="play"></div>
        <aside id="pad" class="pad" aria-label="Score pad" hidden></aside>
      </div>
    </section>

    <section class="library" aria-labelledby="lib-title">
      <div class="lib-head">
        <h2 id="lib-title">The library</h2>
        <span id="count" class="count"></span>
        <button type="button" class="token paper" data-key="refresh" data-refresh>Refresh library</button>
      </div>
      <ul id="shelf" class="scatter"></ul>
    </section>
  </main>
</div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="seal" aria-hidden="true">!</div>
  <h2 id="confirm-title">End the current session?</h2>
  <p id="confirm-text"></p>
  <div class="dlg-acts">
    <button type="button" id="confirm-cancel" class="token paper" autofocus>Cancel</button>
    <button type="button" id="confirm-ok" class="token red">Continue</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="mock-core.js"></script>
<script>
const { subscribe, esc, range, glyph, fmtElapsed, mountScenarioBar } = MK;

// Fixed tilt per library slot (all within -5..+5 degrees) so the scatter is stable across renders.
const TILT = [
  { r: -3.6, x: 2, y: -4 },
  { r: 2.8, x: -3, y: 3 },
  { r: -1.2, x: 4, y: 6 },
  { r: 4.6, x: -2, y: -2 },
  { r: -4.8, x: 3, y: 4 },
  { r: 1.9, x: -4, y: -6 },
];
let view = null;

// Real QR code (qrcode-generator, error-correction M) drawn in the table's colours:
// walnut data modules, felt-green finder squares, on cream cardstock. Falls back to a placeholder pattern if the CDN script is blocked.
const qrCache = new Map();
function qrSvg(text) {
  if (qrCache.has(text)) return qrCache.get(text);
  let n, dark;
  try {
    const q = qrcode(0, "M"); q.addData(text); q.make();
    n = q.getModuleCount(); dark = (r, c) => q.isDark(r, c);
  } catch {
    n = 29; let s = [...text].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
    const grid = Array.from({ length: n }, () => Array.from({ length: n }, () => ((s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32) > .5));
    dark = (r, c) => grid[r][c];
  }
  const quiet = 3, size = n + quiet * 2;
  const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  let data = "", marks = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (!dark(r, c)) continue;
    const rect = `<rect x="${c + quiet}" y="${r + quiet}" width="1.02" height="1.02" rx=".16"/>`;
    if (finder(r, c)) marks += rect; else data += rect;
  }
  const svg = `<svg viewBox="0 0 ${size} ${size}" role="img" aria-hidden="true"><g fill="#2b1a0e">${data}</g><g fill="#234a3f">${marks}</g></svg>`;
  qrCache.set(text, svg);
  return svg;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest(".qr-ticket");
  if (!t) return;
  t.classList.add("copied");
  clearTimeout(t._c); t._c = setTimeout(() => t.classList.remove("copied"), 1600);
});

const cover = (g) => `<div class="cover" style="--hue:${g.hue};--hue2:${(g.hue + 24) % 360}">
  <span class="glyph">${glyph(g.id)}</span>
  <span class="chip">${esc(g.tag)}</span>
  <span class="band"><b>${esc(g.name)}</b><small>${range(g)} players</small></span>
</div>`;

const meepleSvg = (cls, i) => `<svg class="meeple ${cls} tok" style="--i:${i}" viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="7" r="5.5"/><path d="M6 14.5h12c0 4-1.6 6.2-2.8 8.2 2.2 1 3.8 3 3.8 6.3H5c0-3.3 1.6-5.3 3.8-6.3C7.6 20.7 6 18.5 6 14.5z"/></svg>`;

const DROP_ZONE = `<div class="drop">
  <b>Drop a box here</b>
  <p>Pick a box from the library below and it lands here, ready to open.</p>
  <svg class="arrow" viewBox="0 0 120 80" aria-hidden="true"><path d="M10 12C48 4 96 22 104 62"/><path d="M90 50 104 64 112 48"/></svg>
</div>`;

function openBox(g) {
  return `<div class="opened" style="--hue:${g.hue};--hue2:${(g.hue + 24) % 360}">
    <div class="tray">
      <span class="die d3 tok" style="--i:0"></span>
      <span class="die d5 tok" style="--i:1"></span>
      <span class="cube q1 tok" style="--i:2"></span>
      <span class="cube q2 tok" style="--i:3"></span>
      ${meepleSvg("m1", 4)}
      ${meepleSvg("m2", 5)}
    </div>
    <div class="lid-leaning">${cover(g)}</div>
    <div class="fan" aria-hidden="true">
      <span class="card back k1 tok" style="--i:6"></span>
      <span class="card back k2 tok" style="--i:7"></span>
      <span class="card face k3 tok" style="--i:8">${glyph(g.id)}</span>
    </div>
    <div class="booklet">
      <p class="bk-title">Rulebook</p>
      <p class="bk-text">${esc(g.description)}</p>
    </div>
    <div class="torn-wrap">
      <div class="torn">
        <p class="torn-title">Didn&rsquo;t start</p>
        <p class="torn-text">${esc(g.message)}</p>
      </div>
    </div>
    <span class="xtok" aria-hidden="true"></span>
  </div>`;
}

function padHTML(g, v) {
  const running = g.status === "running";
  return `
    <p class="pad-kicker">Score pad</p>
    <h2 class="pad-title">${esc(g.name)}</h2>
    <p class="lamp ${g.status}"><i aria-hidden="true"></i>${esc(g.label)}</p>
    <p class="meta">${range(g)} players · about ${g.mins} min</p>
    ${running ? `<p class="up">Up for <span id="elapsed">${fmtElapsed(v.startedAt)}</span></p>` : ""}
    ${running ? `<button type="button" class="qr-ticket" data-key="copy" data-copy="${esc(g.playUrl)}"
      aria-label="Join QR code. Press to copy the join link so you can share it.">
      <span class="qr-k">Scan to join</span>
      <span class="qr-box">${qrSvg(g.playUrl)}</span>
      <span class="qr-hint">tap to copy the link</span>
      <span class="qr-stamp" aria-hidden="true">Link copied</span>
    </button>` : ""}
    <div class="pad-acts">
      ${g.canOpen ? `<a class="token brass" href="#" data-key="open-play" data-open="play" data-game="${g.id}">Open game</a>` : ""}
      ${g.canOpen && g.boardUrl ? `<a class="token paper" href="#" data-key="open-board" data-open="board" data-game="${g.id}">Open board display</a>` : ""}
      ${g.canStop ? `<button type="button" class="token wood" data-key="stop" data-act="stop" data-game="${g.id}"${g.stopDisabled ? " disabled" : ""}>Stop game</button>` : ""}
      ${g.status === "failed" ? `<button type="button" class="token brass" data-key="restart" data-act="start" data-game="${g.id}"${g.startDisabled ? " disabled" : ""}>${esc(g.startLabel)}</button>` : ""}
    </div>`;
}

function renderNotes(v) {
  const parts = [];
  if (v.unavailable) {
    parts.push(`<p class="banner bad"><span>The line to the Nexus host dropped, so controls are paused.</span>${
      v.runtime ? `<button type="button" class="token paper" data-key="retry" data-act="stop" data-game="${v.runtime.gameId}"${v.pending ? " disabled" : ""}>Retry stop active game</button>` : ""
    }</p>`);
  }
  if (v.cleanupRequired) {
    parts.push(`<p class="banner bad">Clean-up is unresolved. Try “Stop game” again; if it keeps failing, check the Nexus host console. Starting another game is paused.</p>`);
  }
  document.querySelector("#notes").innerHTML = parts.join("");
}

function renderPlay(v) {
  const play = document.querySelector("#play");
  const pad = document.querySelector("#pad");
  const g = v.active;
  pad.hidden = !g;
  if (!g) {
    play.className = "play empty";
    play.innerHTML = DROP_ZONE;
    pad.innerHTML = "";
    return;
  }
  play.className = `play ${g.status}`;
  play.innerHTML = openBox(g);
  pad.innerHTML = padHTML(g, v);
}

function boxSlot(g, i) {
  const t = TILT[i % TILT.length];
  return `<li class="slot" style="--r:${t.r}deg;--dx:${t.x}px;--dy:${t.y}px">
    <div class="lid">${cover(g)}</div>
    <div class="tag">
      <span class="info">${g.mins} min · ${g.boardUrl ? "TV board ✓" : "phones only"}</span>
      <button type="button" class="token brass" data-key="start-${g.id}" data-act="start" data-game="${g.id}"${g.startDisabled ? " disabled" : ""}>${esc(g.startLabel)}</button>
    </div>
  </li>`;
}

const gapSlot = `<li class="slot"><div class="gap-box"><span>Out on the table</span></div></li>`;

function renderLibrary(v) {
  document.querySelector("#count").textContent = v.unavailable
    ? "Connection lost · controls paused"
    : `${v.count} boxes in the library${v.locked ? " · updating…" : ""}`;
  document.querySelector("#shelf").innerHTML = v.games
    .map((g, i) => (g.isActive ? gapSlot : boxSlot(g, i)))
    .join("");
}

function render(v) {
  // Re-rendering replaces buttons; keep keyboard focus on the equivalent control when it still exists.
  const focusedKey = document.activeElement?.dataset?.key;
  view = v;
  renderNotes(v);
  document.querySelector("#feedback").textContent = v.feedback;
  renderPlay(v);
  renderLibrary(v);
  if (focusedKey) document.querySelector(`[data-key="${focusedKey}"]`)?.focus({ preventScroll: true });
}

subscribe(render);
// Only the elapsed text is updated on the timer; the rest of the page is never re-rendered by it.
setInterval(() => {
  const el = document.querySelector("#elapsed");
  if (el && view?.startedAt) el.textContent = fmtElapsed(view.startedAt);
}, 1000);
mountScenarioBar();
</script>
</body>
</html>
